<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>살까말까 · 영상 속 제품 모음</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#252932;--tx:#eef1f6;--sub:#9aa3b2;--pt:#ffd84d;--pt2:#2b3040}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 padding:22px 16px 60px;max-width:560px;margin:0 auto}
.hd{text-align:center;margin-bottom:14px}
.hd img{width:76px;height:76px;border-radius:50%;object-fit:cover}
.hd h1{font-size:20px;margin:10px 0 4px}
.hd p{color:var(--sub);font-size:13px;margin:0}
.notice{background:#1b1e26;border:1px solid var(--line);border-radius:12px;
 padding:11px 13px;font-size:11.5px;line-height:1.65;color:var(--sub);margin:14px 0 18px}
.notice b{color:#c9d2e0;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:14px 15px;margin-bottom:12px}
.no{color:var(--pt);font-weight:800;margin-right:2px}
.name{font-size:16px;font-weight:700;margin:3px 0 3px}
.desc{color:var(--sub);font-size:12.5px;line-height:1.55;margin-bottom:11px}
.main{display:block;background:var(--pt);color:#1a1d24;text-align:center;
 font-weight:700;font-size:14.5px;padding:12px;border-radius:10px;text-decoration:none}
.subs{display:flex;gap:7px;margin-top:8px}
.subs{flex-wrap:wrap}
.subs a{flex:1 1 30%;background:var(--pt2);color:#cfd6e4;text-align:center;font-size:11.5px;
 padding:9px 4px;border-radius:8px;text-decoration:none;border:1px solid var(--line)}
.ft{text-align:center;color:#5c6474;font-size:11px;margin-top:26px;line-height:1.7}
</style>
</head>
<body>
<div class="hd">
  <img src="profile.jpg" alt="살까말까">
  <h1>살까말까</h1>
  <p>고민되는 그 물건, 대신 써보고 알려드려요</p>
  <p style="margin-top:6px;font-size:12px;color:#7b8698">영상 번호와 아래 번호가 같습니다</p>
</div>

<div class="notice">
  이 페이지는 <b>쿠팡 파트너스 활동의 일환</b>으로, 이에 따른 일정액의 수수료를 제공받습니다.<br>
  영상 속 제품과 아래 상품은 <b>동일한 제품이 아닐 수 있습니다.</b>
  기능·형태가 비슷한 상품을 골라 소개하니 구매 전 규격과 옵션을 확인해 주세요.
</div>

<div id="list"></div>

<div class="ft">© 살까말까<br>문의는 유튜브 댓글로 남겨주세요</div>

<script>
fetch('products.json?v=' + Date.now()).then(r => r.json()).then(items => {
  const el = document.getElementById('list');
  items.sort((a, b) => b.no - a.no);
  el.innerHTML = items.map(p => {
    const no = String(p.no).padStart(2,'0');
    const main = p.primary || p.search;
    const label = p.primary ? '영상과 비슷한 상품 보기' : '쿠팡에서 비슷한 제품 보기';
    const subs = [];
    if (p.alt1) subs.push(`<a href="${p.alt1}" target="_blank" rel="nofollow sponsored noopener">가성비 [저렴해요]</a>`);
    if (p.alt2) subs.push(`<a href="${p.alt2}" target="_blank" rel="nofollow sponsored noopener">프리미엄 [좋아요]</a>`);
    if (p.primary && p.search) subs.push(`<a href="${p.search}" target="_blank" rel="nofollow sponsored noopener">비슷한 제품 전체보기</a>`);
    return `<div class="card">
      <div class="name"><span class="no">${no}.</span> ${p.title}</div>
      <div class="desc">${p.desc || ''}</div>
      <a class="main" href="${main}" target="_blank" rel="nofollow sponsored noopener">${label}</a>
      ${subs.length ? `<div class="subs">${subs.join('')}</div>` : ''}
    </div>`;
  }).join('');
});
</script>
</body>
</html>
