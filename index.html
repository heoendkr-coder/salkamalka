<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>살까말까 추천템</title>
<meta name="description" content="고민되는 그 물건, 대신 써보고 알려드려요. 영상 속 제품 모음.">
<meta property="og:title" content="살까말까 추천템">
<meta property="og:description" content="영상 속 제품, 번호로 바로 찾기">
<meta property="og:image" content="profile.jpg">
<style>
:root{--bg:#faf7f2;--card:#ffffff;--ink:#2b2926;--sub:#8a857d;--accent:#e8a13c;--line:#eee7db}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
     min-height:100vh;padding-bottom:60px}
.wrap{max-width:460px;margin:0 auto;padding:28px 18px 0}
.head{text-align:center;padding:8px 0 4px}
.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #fff;
        box-shadow:0 4px 18px rgba(0,0,0,.10)}
h1{font-size:22px;margin-top:12px;letter-spacing:-.3px}
.tag{color:var(--sub);font-size:13.5px;margin-top:6px;line-height:1.5}
.notice{margin:18px 0 6px;padding:10px 14px;background:#f3ede2;border-radius:12px;
        color:#7a715f;font-size:11.5px;line-height:1.55;text-align:center}
.yt{display:block;text-align:center;margin:14px auto 4px;color:#b3543f;font-size:13px;
    text-decoration:none;font-weight:600}
.list{margin-top:14px;display:flex;flex-direction:column;gap:12px}
a.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
       border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink);
       transition:transform .08s ease;box-shadow:0 2px 10px rgba(60,50,30,.05)}
a.card:active{transform:scale(.985)}
.num{flex:0 0 40px;height:40px;border-radius:12px;background:#fdf3e3;color:var(--accent);
     display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.info{flex:1;min-width:0}
.name{font-weight:700;font-size:15px;line-height:1.35}
.desc{color:var(--sub);font-size:12.5px;margin-top:3px;line-height:1.4}
.go{flex:0 0 auto;color:var(--accent);font-weight:800;font-size:18px}
.soon{opacity:.45;pointer-events:none}
.foot{text-align:center;color:#b9b2a6;font-size:11px;margin-top:34px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img class="avatar" src="profile.jpg" alt="살까말까">
    <h1>살까말까</h1>
    <div class="tag">고민되는 그 물건, 대신 써보고 알려드려요<br>영상 속 번호로 바로 찾으세요 👇</div>
  </div>

  <div class="notice">본 페이지의 일부 링크는 쿠팡 파트너스 활동을 통해<br>일정액의 수수료를 제공받습니다.</div>

  <a class="yt" href="https://www.youtube.com/@salkamalkatv" target="_blank" rel="noopener">▶ 유튜브 채널 보러가기</a>

  <div class="list">
    <a class="card" id="p1" href="https://www.coupang.com/np/search?q=%EB%A0%88%EC%9D%BC%20LED%20%EC%95%8C%ED%8C%8C%EB%B2%B3%20%EC%A1%B0%EB%AA%85" target="_blank" rel="noopener">
      <div class="num">1</div>
      <div class="info">
        <div class="name">알파벳 LED 조명 (레일형)</div>
        <div class="desc">간판집 없이 끼우기만 하면 끝 · 첫 영상 제품</div>
      </div>
      <div class="go">›</div>
    </a>
  </div>

  <div class="foot">
    ⓒ 살까말까 · 문의는 유튜브 댓글로<br>
    제품은 영상 순서대로 번호가 붙습니다
  </div>
</div>
</body>
</html>
