<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>살까말까 · 영상 속 제품 모음</title>
<meta name="description" content="살까말까 영상에 나온 제품을 번호로 찾아보세요. 쿠팡 파트너스 활동의 일환으로 수수료를 제공받습니다.">
<meta name="theme-color" content="#F5F3ED">
<meta property="og:title" content="살까말까 · 영상 속 제품 모음">
<meta property="og:description" content="영상 번호로 바로 찾기">
<meta property="og:image" content="hero.jpg">
<link rel="icon" href="avatar.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--ground:#F5F3ED;--surface:#FFFFFF;--ink:#15201B;--muted:#66706A;--line:#E4E1D8;
 --accent:#14503F;--accent-ink:#FFFFFF;--num:#C38A12;--r:18px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
 word-break:keep-all;overflow-wrap:anywhere;
 font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
.serif{font-family:"Instrument Serif",Georgia,"Times New Roman",serif}

.hero{position:relative;overflow:hidden;background:var(--accent);color:#fff}
.hero-img{position:absolute;inset:0;background-position:center;background-size:cover}
.hero::after{content:"";position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.18) 40%,rgba(0,0,0,.66) 100%)}
.hero .wrap{position:relative;z-index:1;display:flex;align-items:flex-end;gap:14px;padding-block:132px 24px}
.avatar{width:72px;height:72px;flex:none;border-radius:50%;object-fit:cover;background:#fff;
 box-shadow:0 0 0 2px rgba(255,255,255,.9),0 6px 18px rgba(0,0,0,.25)}
.eyebrow{margin:0 0 2px;font-size:12px;font-weight:600;letter-spacing:.12em;opacity:.85}
.hero h1{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.tag{margin:6px 0 0;font-size:14px;opacity:.92;text-wrap:balance}
.hero.light{background:var(--ground);color:var(--ink)}
.hero.light::after{background:linear-gradient(180deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.82) 82%,#fff 100%);
 background:linear-gradient(180deg,transparent 30%,color-mix(in srgb,var(--ground) 84%,transparent) 78%,var(--ground) 100%)}
.hero.light .eyebrow{color:var(--accent);opacity:1}
.hero.light .tag{color:var(--muted);opacity:1}
.hero.light .avatar{box-shadow:0 0 0 3px #fff,0 8px 22px rgba(0,0,0,.14)}

.finder{position:sticky;top:0;z-index:5;background:var(--ground);
 background:color-mix(in srgb,var(--ground) 90%,transparent);
 -webkit-backdrop-filter:saturate(1.3) blur(12px);backdrop-filter:saturate(1.3) blur(12px);
 border-bottom:1px solid var(--line)}
.finder .wrap{padding-block:12px}
.finder label{display:block;margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.frow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
 border-radius:14px;padding:5px 5px 5px 14px}
.frow:focus-within{border-color:var(--accent)}
.frow .pre{font-size:21px;font-style:italic;color:var(--num)}
.frow input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);
 font:inherit;font-size:18px;font-weight:700;padding:9px 0;font-variant-numeric:tabular-nums}
.frow input::placeholder{color:var(--muted);font-weight:500}
.frow button{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);
 font:inherit;font-size:15px;font-weight:700;padding:11px 18px;cursor:pointer}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips span{flex:none;align-self:center;font-size:12px;color:var(--muted);margin-right:2px}
.chip{flex:none;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--surface);
 border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-variant-numeric:tabular-nums}

.notice{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
 font-size:12px;line-height:1.7;color:var(--muted)}
.notice b{color:var(--ink);font-weight:600}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.sec h2{margin:0;font-size:15px;font-weight:700}
.sec p{margin:0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.list{display:grid;gap:12px;margin:0 0 36px}
.card{display:grid;grid-template-columns:1fr;gap:14px;background:var(--surface);border:1px solid var(--line);
 border-radius:var(--r);padding:16px;scroll-margin-top:130px;transition:border-color .25s,box-shadow .25s}
.card.has-thumb{grid-template-columns:86px 1fr}
.thumb{width:86px;aspect-ratio:9/16;object-fit:cover;border-radius:12px;background:var(--line);display:block}
.no{display:flex;align-items:baseline;gap:4px;line-height:1;color:var(--num);font-size:34px;font-variant-numeric:lining-nums}
.no i{font-size:17px;color:var(--muted)}
.card h3{margin:6px 0 4px;font-size:17px;line-height:1.35;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.desc{margin:0 0 6px;font-size:13.5px;color:var(--muted)}
.pick{margin:0 0 12px;font-size:12.5px;line-height:1.55;color:var(--muted);
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick b{font-size:11px;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:6px;
 padding:1px 6px;margin-right:6px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);
 color:var(--accent-ink);text-decoration:none;font-size:15px;font-weight:700;border-radius:12px;padding:13px 16px}
.cta:active{transform:translateY(1px)}
.alts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.alts a{font-size:12.5px;color:var(--ink);text-decoration:none;background:var(--ground);
 border:1px solid var(--line);border-radius:999px;padding:6px 11px}
.card.hl{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.found{display:none;margin-left:8px;align-self:center;font-family:"Pretendard Variable",Pretendard,sans-serif;
 font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:4px 8px}
.card.hl .found{display:inline-block}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:40px 0}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100% - 32px);
 background:var(--ink);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:12px;opacity:0;
 pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
footer{border-top:1px solid var(--line);padding-block:22px 44px;text-align:center;font-size:12px;line-height:1.8;color:var(--muted)}
footer a{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:560px){.hero .wrap{padding-block:180px 30px}.hero h1{font-size:38px}
 .avatar{width:84px;height:84px}.card.has-thumb{grid-template-columns:100px 1fr}.thumb{width:100px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hero light">
  <div class="hero-img" style="background-image:url(hero.jpg);background-position:18% 42%"></div>
  <div class="wrap">
    <img class="avatar" src="avatar.png" alt="살까말까 로고" width="72" height="72">
    <div>
      <p class="eyebrow">영상 속 제품 모음</p>
      <h1>살까말까</h1>
      <p class="tag">고민되는 그 물건, 먼저 보고 결정하세요</p>
    </div>
  </div>
</header>

<div class="finder">
  <div class="wrap">
    <label for="jin">영상에서 본 번호를 입력하세요</label>
    <form class="frow" id="jform">
      <span class="pre serif">No.</span>
      <input id="jin" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="예) 167">
      <button type="submit">찾기</button>
    </form>
    <div class="chips" id="recent"></div>
  </div>
</div>

<main class="wrap">
  <p class="notice">이 페이지는 <b>쿠팡 파트너스 활동의 일환</b>으로, 이에 따른 일정액의 수수료를 제공받습니다.
  영상 속 제품과 아래 상품은 <b>동일한 제품이 아닐 수 있습니다.</b> 기능·형태가 비슷한 상품을 골라 소개하니 구매 전 규격과 옵션을 확인해 주세요.</p>
  <div class="sec"><h2>전체 제품</h2><p id="count"></p></div>
  <div class="list" id="list"><p class="empty">제품을 불러오는 중이에요…</p></div>
</main>

<footer>
  <div class="wrap">© 살까말까 · <a href="https://www.youtube.com/@salkamalkatv" rel="noopener">유튜브 채널</a><br>문의는 유튜브 댓글로 남겨주세요</div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var list = document.getElementById('list');
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });
  };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var tidy = function (s) {
    s = String(s || '').replace(/\s+/g, ' ').replace(/\s*\d+%.*$/, '').replace(/\s*[\d,]+원.*$/, '').trim();
    return s.length > 60 ? s.slice(0, 58) + '…' : s;
  };
  var link = function (href, text) {
    return '<a href="' + esc(href) + '" target="_blank" rel="nofollow sponsored noopener">' + text + '</a>';
  };
  var card = function (p) {
    var main = p.primary || p.search;
    var alts = [];
    if (p.alt1) alts.push(link(p.alt1, '가성비 상품'));
    if (p.alt2) alts.push(link(p.alt2, '프리미엄 상품'));
    if (p.primary && p.search) alts.push(link(p.search, '비슷한 제품 전체'));
    var thumb = p.video
      ? '<img class="thumb" loading="lazy" alt="" src="https://i.ytimg.com/vi/' + encodeURIComponent(p.video) +
        '/hqdefault.jpg" onload="if(this.naturalWidth<200)this.onerror()" onerror="var c=this.closest(\'.card\');if(c)c.classList.remove(\'has-thumb\');this.remove()">'
      : '';
    var pick = p.primaryName ? '<p class="pick"><b>연결 상품</b>' + esc(tidy(p.primaryName)) + '</p>' : '';
    return '<article class="card' + (p.video ? ' has-thumb' : '') + '" id="p' + esc(p.no) + '">' + thumb +
      '<div><div class="no serif"><i>No.</i>' + pad(p.no) + '<span class="found">찾는 상품</span></div>' +
      '<h3>' + esc(p.title) + '</h3>' +
      (p.desc ? '<p class="desc">' + esc(p.desc) + '</p>' : '') + pick +
      '<a class="cta" href="' + esc(main) + '" target="_blank" rel="nofollow sponsored noopener">' +
      (p.primary ? '쿠팡에서 보기' : '쿠팡에서 비슷한 제품 찾기') + '<span aria-hidden="true">→</span></a>' +
      (alts.length ? '<div class="alts">' + alts.join('') + '</div>' : '') +
      '</div></article>';
  };
  var toastTimer;
  var toast = function (msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2600);
  };
  var jump = function () {
    var n = decodeURIComponent(location.hash.slice(1)).replace(/\D/g, '');
    document.querySelectorAll('.card.hl').forEach(function (c) { c.classList.remove('hl'); });
    if (!n) return;
    var t = document.getElementById('p' + parseInt(n, 10));
    if (t) {
      t.classList.add('hl');
      var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      t.scrollIntoView({block: 'center', behavior: calm ? 'auto' : 'smooth'});
    } else {
      toast('No.' + pad(n) + ' 제품을 찾지 못했어요. 번호를 다시 확인해 주세요.');
    }
  };
  document.getElementById('jform').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('jin').value.replace(/\D/g, '');
    if (!v) return;
    if (location.hash.replace('#', '') === v) jump(); else location.hash = v;
    document.getElementById('jin').blur();
  });
  fetch('products.json?v=' + Date.now()).then(function (r) { return r.json(); }).then(function (items) {
    items = items.filter(function (p) { return p && p.no != null; }).sort(function (a, b) { return b.no - a.no; });
    document.getElementById('count').textContent = items.length + '개';
    list.innerHTML = items.length ? items.map(card).join('') : '<p class="empty">아직 등록된 제품이 없어요.</p>';
    document.getElementById('recent').innerHTML = items.length
      ? '<span>최근</span>' + items.slice(0, 6).map(function (p) { return '<a class="chip" href="#' + p.no + '">No.' + pad(p.no) + '</a>'; }).join('')
      : '';
    jump();
    window.addEventListener('hashchange', jump);
  }).catch(function () {
    list.innerHTML = '<p class="empty">제품 목록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>';
  });
})();
</script>
</body>
</html>
